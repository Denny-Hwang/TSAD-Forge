# Model cards — one entry per registered model (tests/test_model_cards.py enforces coverage).
#
# fidelity: how close this repository's implementation is to the cited method.
#   library            delegates to a maintained library / official package (sklearn, stumpy,
#                      statsmodels, pretrained-model packages)
#   reference          classical algorithm implemented from its textbook definition
#   upstream_verified  behavior checked line-by-line against the official code
#   paper              follows the paper's method; omitted parts are protocol-level only
#                      (e.g. thresholding handled by our thresholding module)
#   simplified         paper-based reimplementation with documented simplifications that can
#                      change accuracy — do NOT read its leaderboard row as the original
#                      method's performance
#   baseline           sanity / proposed baselines defined by this repository
#
# implementation: own | library | adapter (pip dependency, no code copied in any case)
# deviations: what differs from the cited method (mirrors the module docstrings).

ae:
  title: Dense autoencoder (window reconstruction)
  citation: Sakurada & Yairi, MLSDA workshop 2014
  year: 2014
  implementation: own
  fidelity: reference
  deviations: []

