[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsad-forge"
version = "0.2.0"
description = "A reproducible benchmarking and learning ecosystem for time-series anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TSAD-Forge contributors" }]
keywords = ["time-series", "anomaly-detection", "benchmark", "reproducibility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
    "scipy>=1.11",        # HP filter 등 (sklearn 의존이지만 직접 사용을 명시)
    "stumpy>=1.12",       # Matrix Profile (BSD-3-Clause)
    "statsmodels>=0.14",  # STL (BSD-3-Clause)
    "tabulate>=0.9",      # 리더보드 마크다운
    "plotly>=5.20",       # 시각화 8종 (MIT)
    "openpyxl>=3.1",      # MBA(xlsx) 로더 (MIT)
    "psutil>=5.9",        # 런타임 무오염 메모리 계측 (runner/measure.py, BSD-3)
]

[project.optional-dependencies]
# Gen 3-5 딥러닝 모델용. 기본 config는 8GB VRAM (RTX A2000 Laptop) 기준.
dl = ["torch>=2.6"]
# Gen 5 파운데이션 모델 어댑터 (M5에서 라이선스 감사 후 확정)
foundation = ["torch>=2.6"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "types-psutil",
]

[project.scripts]
tsad-forge = "tsad_forge.cli:main"

[project.urls]
Repository = "https://github.com/Denny-Hwang/TSAD-Forge"

[tool.setuptools.packages.find]
include = ["tsad_forge*"]

[tool.setuptools.package-data]
tsad_forge = ["data/checksums/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
# vendored 코드 무수정 원칙 + 노트북은 교육용 스타일 허용
extend-exclude = ["tsad_forge/evaluation/_vendor", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # line length는 black이 관리

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "tsad_forge/evaluation/_vendor"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # PA-F1 경고는 의도된 동작이므로 테스트에서 에러로 승격하지 않음
    "default::UserWarning",
    # vendored TSB-AD 코드의 docstring escape 경고 (원 코드 무수정 원칙)
    "ignore:invalid escape sequence:DeprecationWarning",
    "ignore:invalid escape sequence:SyntaxWarning",
]

[tool.mypy]
# python_version은 고정하지 않는다 — 실행 인터프리터를 따른다
# (최신 numpy 스텁은 3.12 전용 `type` 문을 쓰므로 3.11 고정 시 3.12 러너에서 파싱 실패).
# 완화된 시작점 (리뷰 P2): 공개 API 시그니처의 타입 정합성 검사가 목적.
# strict 모드 승격은 roadmap. vendored 코드는 검사하지 않는다.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["tsad_forge/evaluation/_vendor", "notebooks", "build"]

[[tool.mypy.overrides]]
module = "tsad_forge.evaluation._vendor.*"
ignore_errors = true
