# MambaTSAD faithful vs fixed 스모크 비교 (CPU 가능, 소형 설정).
# 논문 설정 재현은 mamba_paper_repro.yaml, 이슈별 분리 측정은 mamba_ablation.yaml.
# 소형 설정(window 32, 2 epoch, d_model 16)이라 논문 수치·결론의 근거로 쓰지 말 것.
results_dir: benchmarks/results
seeds: [0, 1, 2]
defaults:
  normalize: zscore
  threshold: { method: quantile, q: 0.99 }
  sliding_window: 100

models:
  - { model: mamba_tsad_faithful, stochastic: true, model_params: { epochs: 2, window: 32, d_model: 16 } }
  - { model: mamba_tsad_fixed, stochastic: true, model_params: { epochs: 2, window: 32, d_model: 16 } }

datasets:
  - synthetic
  - { data: synthetic, data_params: { n_dims: 5, n_events: 8 } }
  - { data: skab, data_params: { experiment: valve1/0 } }
