# M5 DoD: MambaTSAD faithful vs fixed 비교 (CLAUDE.md §3).
# 결과는 docs/learn/ch06 및 리더보드에서 '구현 이슈 수정 효과'로 인용된다.
results_dir: benchmarks/results
seeds: [0, 1, 2]
defaults:
  normalize: zscore
  threshold: { method: quantile, q: 0.99 }
  sliding_window: 100

models:
  - { model: mamba_tsad_faithful, stochastic: true, model_params: { epochs: 3, window: 32 } }
  - { model: mamba_tsad_fixed, stochastic: true, model_params: { epochs: 3, window: 32 } }

datasets:
  - synthetic
  - { data: synthetic, data_params: { n_dims: 5, n_events: 8 } }
  - { data: skab, data_params: { experiment: valve1/0 } }
