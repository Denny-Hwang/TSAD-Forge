# DL(Gen3-5) GPU 프로파일 — "학습 부족" 비판(리뷰 P0)에 대한 기본 대응.
#
# lite_dl.yaml(epochs 3~5, window 32)은 CPU 스모크용이다. 이 프로파일은 8GB GPU
# (RTX A2000 Laptop 기준)에서 DL 모델에 실제 학습 예산을 준다:
#   - 시간순 검증 분할(val_ratio) + 조기 종료(patience) + 정체 시 LR 감소
#   - bf16 autocast (CUDA에서만; CPU에서는 자동 무시)
#   - train 윈도우 상한 완화 (SMD train ≈ 28k 점 → 전부 사용)
# 데이터셋 목록은 lite.yaml과 **동일**하다 — Gen1-2와 같은 entity에서 비교해야
# 세대 비교가 데이터 난이도 비교로 변질되지 않는다 (docs/methodology.md 집계 규칙).
#
# 정규화는 lite.yaml과 같은 레거시 z-score를 유지한다 (같은 입력에서 비교).
# normalize_params.std_floor를 켜려면 lite.yaml도 같이 바꿔 전 모델을 재실행하라.
#
# 실행: python benchmarks/run_all.py --profile configs/lite_dl_gpu.yaml
# device: auto → CUDA가 있으면 cuda. GPU 결과는 CPU 결과와 다른 config_hash를 갖는다.
results_dir: benchmarks/results
seeds: [0, 1, 2]
defaults:
  normalize: zscore
  threshold: { method: quantile, q: 0.99 }
  sliding_window: 100
  device: auto

# 공통 학습 예산 (모델별 model_params에 병합)
_train: &train
  epochs: 50
  batch_size: 128
  lr: 0.001
  val_ratio: 0.2
  patience: 5
  min_delta: 0.0001
  lr_schedule: plateau
  amp: bf16
  max_train_windows: 50000
  score_batch_size: 512

models:
  # MambaTSAD는 &train 예산이 아니라 공식 코드의 학습 프로토콜을 따른다 (mamba_tsad.py)
  - model: ae
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: lstm_ad
    stochastic: true
    model_params: { <<: *train, window: 100, hidden: 64 }
  - model: lstm_p
    stochastic: true
    model_params: { <<: *train, window: 100, hidden: 64 }
  - model: vae_donut
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: dagmm
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: omni_anomaly
    stochastic: true
    model_params: { <<: *train, window: 100, hidden: 64 }
  - model: usad
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: gdn
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: mtad_gat
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: anomaly_transformer
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: tranad
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - model: dcdetector
    stochastic: true
    model_params: { <<: *train, window: 100, patch: 10 }
  - model: timesnet
    stochastic: true
    model_params: { <<: *train, window: 100 }
  - { model: mamba_tsad_faithful, stochastic: true }  # 공식 프로토콜 (7 epoch, window 100)
  - { model: mamba_tsad_fixed, stochastic: true }  # 공식 프로토콜 (7 epoch, window 100)

datasets:
  # 합성 (항상 가능)
  - synthetic
  - { data: synthetic, data_params: { n_dims: 5, n_events: 8 } }
  # SMD 3개 머신
  - { data: smd, data_params: { machine: machine-1-1 } }
  - { data: smd, data_params: { machine: machine-2-1 } }
  - { data: smd, data_params: { machine: machine-3-2 } }
  # MambaTSAD 논문(SPL 2024) 엔티티 커버리지 확장
  - { data: smd, data_params: { machine: machine-3-7 } }
  - { data: smd, data_params: { machine: machine-1-6 } }
  # SMAP 3채널 (데이터 없으면 skip)
  - { data: smap, data_params: { channel: P-1 } }
  - { data: smap, data_params: { channel: E-1 } }
  - { data: smap, data_params: { channel: T-1 } }
  - { data: smap, data_params: { channel: A-4 } }   # MambaTSAD 논문 엔티티
  - { data: msl, data_params: { channel: C-2 } }    # MambaTSAD 논문 엔티티
  # UCR 일부 (데이터 없으면 skip)
  - { data: ucr, data_params: { series: 1 } }
  - { data: ucr, data_params: { series: 135 } }
  # NAB / PSM / SKAB
  - { data: nab, data_params: { rel_path: realAWSCloudwatch/ec2_cpu_utilization_24ae8d.csv } }
  - { data: nab, data_params: { rel_path: realKnownCause/machine_temperature_system_failure.csv } }
  - { data: psm }
  - { data: skab, data_params: { experiment: valve1/0 } }
  # MGAB (CC0) / MBA (BSD-3 repo; PhysioNet ODC-BY)
  - { data: mgab, data_params: { series: 1 } }
  - { data: mgab, data_params: { series: 2 } }
  - { data: mba }
