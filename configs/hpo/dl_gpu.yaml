# HPO 스터디 — Gen3-4 (lite_dl_gpu 프로파일 대상, GPU 권장). 학습 예산(&train)은 평가
# 프로파일에서 상속하고 구조/lr만 탐색한다. MambaTSAD는 공식 설정 재현이 목적이라 제외.
name: dl_gpu
eval_profile: configs/lite_dl_gpu.yaml
spaces: configs/hpo/spaces.yaml
n_trials: 12
seed: 0
metric: vus_pr
results_dir: benchmarks/hpo/dl_gpu
output: configs/hpo/selected/dl_gpu.yaml
models: [ae, lstm_ad, lstm_p, vae_donut, dagmm, omni_anomaly, usad,
         gdn, mtad_gat, anomaly_transformer, tranad, dcdetector, timesnet]
tuning_datasets:
  # lite 평가 entity와 겹치지 않는 같은 데이터셋군의 다른 entity (load_study가 겹침 검사)
  - { data: synthetic, data_params: { seed: 101 } }
  - { data: synthetic, data_params: { seed: 102, n_dims: 5, n_events: 8 } }
  - { data: smd, data_params: { machine: machine-1-2 } }
  - { data: smd, data_params: { machine: machine-2-2 } }
  - { data: smd, data_params: { machine: machine-3-1 } }
  - { data: smap, data_params: { channel: E-2 } }
  - { data: smap, data_params: { channel: A-1 } }
  - { data: ucr, data_params: { series: 2 } }
  - { data: ucr, data_params: { series: 3 } }
  - { data: skab, data_params: { experiment: valve1/1 } }
  - { data: mgab, data_params: { series: 3 } }
