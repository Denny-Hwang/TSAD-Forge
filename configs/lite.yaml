# lite 프로파일 (CLAUDE.md §5): CI/노트북용 소규모, CPU 가능.
# 사양 목표(UCR 일부 + SMD 3머신 + SMAP 3채널) 중 로컬에 데이터가 없는 항목은
# run_all이 [no-data]로 건너뛴다 (다운로드: tsad-forge download <name>).
# 결정적 모델은 seeds[0]만, stochastic: true 모델은 전체 시드 실행.
results_dir: benchmarks/results
seeds: [0, 1, 2]
defaults:
  normalize: zscore
  threshold: { method: quantile, q: 0.99 }
  sliding_window: 100

models:
  - dummy                      # 무정보 하한선 (ch07 PA 실험 기준)
  - zscore
  # Gen1
  - cusum
  - ewma
  - hotelling_t2
  - pca_t2spe
  - sub_pca
  - stl_residual
  - poly
  - sesd
  # Gen2 (production-proven additions)
  - spectral_residual
  - hbos
  # Gen2
  - lof
  - ocsvm
  - { model: iforest, stochastic: true }
  - knn
  - sub_knn
  - matrix_profile
  # Gen0 proposed consensus baseline
  - ensemble_simple

datasets:
  # 합성 (항상 가능)
  - synthetic
  - { data: synthetic, data_params: { n_dims: 5, n_events: 8 } }
  # SMD 3개 머신
  - { data: smd, data_params: { machine: machine-1-1 } }
  - { data: smd, data_params: { machine: machine-2-1 } }
  - { data: smd, data_params: { machine: machine-3-2 } }
  # SMAP 3채널 (데이터 없으면 skip)
  - { data: smap, data_params: { channel: P-1 } }
  - { data: smap, data_params: { channel: E-1 } }
  - { data: smap, data_params: { channel: T-1 } }
  # UCR 일부 (데이터 없으면 skip)
  - { data: ucr, data_params: { series: 1 } }
  - { data: ucr, data_params: { series: 135 } }
  # NAB / PSM / SKAB
  - { data: nab, data_params: { rel_path: realAWSCloudwatch/ec2_cpu_utilization_24ae8d.csv } }
  - { data: nab, data_params: { rel_path: realKnownCause/machine_temperature_system_failure.csv } }
  - { data: psm }
  - { data: skab, data_params: { experiment: valve1/0 } }
  # MGAB (CC0) / MBA (BSD-3 repo; PhysioNet ODC-BY)
  - { data: mgab, data_params: { series: 1 } }
  - { data: mgab, data_params: { series: 2 } }
  - { data: mba }
