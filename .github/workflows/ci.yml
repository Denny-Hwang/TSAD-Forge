# CI 스모크 (CLAUDE.md §9): lint + pytest + lite 프로파일 일부. 무거운 학습 금지.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Tests
        run: pytest
      - name: CLI smoke (M0 DoD)
        run: tsad-forge run --model dummy --data synthetic --results-dir /tmp/ci-results
