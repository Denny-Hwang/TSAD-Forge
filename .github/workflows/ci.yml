# CI 스모크 (CLAUDE.md §9): lint + pytest + lite 프로파일 일부. 무거운 학습 금지.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Tests
        # -rs: torch 미설치로 스킵되는 테스트를 요약에 표시 (숨은 스킵 방지, 리뷰 P0-5)
        run: pytest -rs
      - name: CLI smoke (M0 DoD)
        run: tsad-forge run --model dummy --data synthetic --results-dir /tmp/ci-results

  # Gen3-5(torch) 모델 테스트 — 메인 job은 torch가 없어 전부 스킵되므로 별도 job에서
  # CPU 휠로 실제 실행한다 (리뷰 P0-5: "pytest 녹색"이 코드베이스 절반만 검증하던 문제)
  test-dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (with torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Gen3-5 model tests
        run: pytest tests/test_gen34_models.py tests/test_gen5_models.py -rs
