# GitHub Pages deployment (CLAUDE.md section 6): docs/ -> mkdocs -> gh-pages branch.
# Deploys by pushing the built site to the gh-pages branch (Pages source: gh-pages).
# Note: the workflow-based deploy (actions/deploy-pages) requires the Pages site to be
# created with admin rights, which the default GITHUB_TOKEN cannot do — the gh-pages
# branch flow avoids that.
name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install mkdocs mkdocs-material mkdocs-static-i18n
      - run: mkdocs build --strict
      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force --no-history
