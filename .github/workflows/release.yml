# Release pipeline (리뷰 P2): v* 태그 푸시 또는 수동 dispatch(tag 입력) →
# sdist/wheel 빌드 → GitHub Release (태그가 없으면 릴리스 생성이 태그도 만든다).
# PyPI 배포는 trusted publishing 설정 후 주석 해제 (CONTRIBUTING.md 'Releases').
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/release-tag"]  # 태그 푸시 권한이 없는 봇/CI 경로용 마커 파일
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0) — created at the target ref if missing"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="$(tr -d '[:space:]' < .github/release-tag)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # 이미 릴리스된 태그면 중복 릴리스를 만들지 않는다
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@v5
        if: steps.tag.outputs.exists == 'false'
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        if: steps.tag.outputs.exists == 'false'
        run: |
          pip install build
          python -m build
      - name: Sanity-check the wheel installs and imports
        if: steps.tag.outputs.exists == 'false'
        run: |
          pip install dist/*.whl
          python -c "import tsad_forge; from tsad_forge.models.registry import list_models; print(len(list_models()), 'models')"
      - name: Create GitHub Release (creates the tag if missing)
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ startsWith(github.ref, 'refs/tags/') && '' || github.sha }}
          files: dist/*
          generate_release_notes: true

  # PyPI publishing via trusted publishing (OIDC). A maintainer must first add
  # this repository as a trusted publisher on pypi.org, then uncomment:
