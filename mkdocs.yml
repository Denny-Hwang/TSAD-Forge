site_name: TSAD-Forge
site_description: A Reproducible Benchmarking and Learning Ecosystem for Time-Series Anomaly Detection
repo_url: https://github.com/Denny-Hwang/TSAD-Forge
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Learn:
      - Overview: learn/index.md
      - ch01 Problem definition: learn/ch01_problem.md
      - ch02 Gen1 Statistical: learn/ch02_gen1_statistical.md
      - ch03 Gen2 Classical ML: learn/ch03_gen2_classical_ml.md
      - ch04 Gen3 Deep Learning: learn/ch04_gen3_dl.md
      - ch05 Gen4 Graph/Transformer: learn/ch05_gen4_graph_transformer.md
      - ch06 Gen5 SSM/Foundation: learn/ch06_gen5_ssm_foundation.md
      - ch07 Evaluation methodology: learn/ch07_evaluation.md
      - ch08 Thresholding: learn/ch08_thresholding.md
      - ch09 Industrial practice: learn/ch09_industrial.md
      - ch10 Reading benchmarks: learn/ch10_reading_benchmarks.md
  - Leaderboard:
      - Charts: leaderboard/index.md
      - Lite table: leaderboard/lite.md
  - Datasets:
      - Overview: datasets/index.md
      - SMAP/MSL: datasets/smap_msl.md
      - SMD: datasets/smd.md
      - UCR: datasets/ucr.md
      - TSB-AD: datasets/tsb_ad.md
      - NAB: datasets/nab.md
      - PSM: datasets/psm.md
      - SKAB: datasets/skab.md
      - Yahoo S5 (apply): datasets/yahoo_s5.md
      - SWaT/WADI (apply): datasets/swat_wadi.md
      - SECOM (reference): datasets/secom.md
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Home: 홈
            Learn: 학습 트랙
            Overview: 개요
            ch01 Problem definition: ch01 문제 정의
            ch02 Gen1 Statistical: ch02 Gen1 통계
            ch03 Gen2 Classical ML: ch03 Gen2 고전 ML
            ch04 Gen3 Deep Learning: ch04 Gen3 딥러닝
            ch05 Gen4 Graph/Transformer: ch05 Gen4 Graph/Transformer
            ch06 Gen5 SSM/Foundation: ch06 Gen5 SSM/Foundation
            ch07 Evaluation methodology: ch07 평가 방법론
            ch08 Thresholding: ch08 임계값
            ch09 Industrial practice: ch09 산업 적용
            ch10 Reading benchmarks: ch10 벤치마크 읽는 법
            Leaderboard: 리더보드
            Charts: 차트
            Lite table: lite 테이블
            Datasets: 데이터셋
            Yahoo S5 (apply): Yahoo S5 (신청)
            SWaT/WADI (apply): SWaT/WADI (신청)
            SECOM (reference): SECOM (참고)
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
