    code_url: https://github.com/aaaceo890/AnoMamba_ijcai
    code_license: null
    generation: gen5
    notes: follow-up of MambaTSAD by the same authors (linked from the official mamba_tsad README)
  - id: dada
    title: DADA — general time-series anomaly detector with adaptive bottlenecks and dual adversarial decoders
    authors: Shentu et al.
    venue: ICLR 2025
    year: 2025
    status: license_audit
    arxiv: null
    code_url: null
    code_license: null
